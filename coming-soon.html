<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coming Soon — Carolynn Heil Interiors</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,900;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --font:    'Montserrat', sans-serif;
  --black:   #0e0e0e;
  --white:   #ffffff;
  --muted:   rgba(14,14,14,0.45);
  --rule:    rgba(14,14,14,0.08);
  --ch-base: #b5451b;
  --bar-h:   45px;
  --pad:     clamp(1.5rem, 5vw, 4.5rem);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--white);
  color: var(--black);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────────────── */
header {
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--pad);
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.ch-logo {
  font-weight: 900;
  font-size: clamp(1.4rem, 2.8vw, 1.85rem);
  letter-spacing: -0.03em;
  color: var(--ch-base);
  text-decoration: none;
}
.site-title {
  font-size: clamp(0.62rem, 1.4vw, 0.80rem);
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--black);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* ── φ bars ──────────────────────────────────────────────── */
.phi-bars {
  width: 100%;
  height: var(--bar-h);
  display: flex;
  overflow: hidden;
  flex-shrink: 0;
}
.phi-bar { height: 100%; flex-shrink: 0; }

/* ── Main ────────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(3rem, 8vw, 6rem) var(--pad);
  text-align: center;
  position: relative;
}

/* φ symbol watermark */
main::before {
  content: 'φ';
  position: absolute;
  font-family: var(--font);
  font-weight: 900;
  font-size: clamp(18rem, 40vw, 28rem);
  color: rgba(14,14,14,0.03);
  letter-spacing: -0.05em;
  pointer-events: none;
  user-select: none;
  line-height: 1;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.eyebrow {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ch-base);
  margin-bottom: 1.2rem;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.3s forwards;
}

.headline {
  font-size: clamp(2rem, 6vw, 4rem);
  font-weight: 300;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: fadeUp 0.9s ease 0.5s forwards;
}
.headline strong { font-weight: 900; }
.headline em { font-style: italic; }

.sub {
  font-size: clamp(0.88rem, 2vw, 1.05rem);
  font-weight: 300;
  line-height: 1.75;
  color: var(--muted);
  max-width: 42ch;
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeUp 0.9s ease 0.7s forwards;
}

/* ── Contact prompt ──────────────────────────────────────── */
.contact-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.9s forwards;
}

.contact-label {
  font-size: 0.60rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}

.contact-email {
  font-size: clamp(0.88rem, 2vw, 1rem);
  font-weight: 500;
  color: var(--black);
  text-decoration: none;
  letter-spacing: 0.02em;
  border-bottom: 1.5px solid var(--ch-base);
  padding-bottom: 2px;
  transition: color 0.18s, border-color 0.18s;
}
.contact-email:hover { color: var(--ch-base); }

.collab {
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  font-weight: 300;
  font-style: italic;
  color: var(--ch-base);
  margin-top: 2rem;
  opacity: 0;
  animation: fadeUp 0.8s ease 1.1s forwards;
}

/* ── Footer ──────────────────────────────────────────────── */
footer {
  background: var(--black);
  padding: 1.4rem var(--pad);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.8rem;
  flex-shrink: 0;
}
.footer-logo { font-weight: 900; font-size: 1.1rem; letter-spacing: -0.03em; color: var(--ch-base); }
.footer-copy { font-size: 0.62rem; font-weight: 300; color: rgba(255,255,255,0.28); letter-spacing: 0.06em; }
.footer-loc  { font-size: 0.62rem; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.28); }

/* ── Animation ───────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0);    }
}
</style>
</head>
<body>

<header>
  <span class="ch-logo" id="ch-logo">CH</span>
  <span class="site-title">Carolynn Heil Interiors</span>
</header>

<div class="phi-bars" id="phi-bars" aria-hidden="true"></div>

<main>
  <h1 class="headline"><strong>Under Construction</strong></h1><br> Coming Soon!
</main>

<footer>
  <span class="footer-logo">CH</span>
  <span class="footer-copy">© 2026 Carolynn Heil Interiors</span>
  <span class="footer-loc">Aspen · Roaring Fork Valley · Colorado</span>
</footer>

<script>
(function(){
  'use strict';
  const PHI = (1 + Math.sqrt(5)) / 2;

  function oklch(L,C,H){
    L=Math.max(0,Math.min(1,L));C=Math.max(0,C);
    const hr=H*Math.PI/180,a=C*Math.cos(hr),b=C*Math.sin(hr);
    const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
    const lv=l_*l_*l_,mv=m_*m_*m_,sv=s_*s_*s_;
    let R=4.0767416621*lv-3.3077115913*mv+0.2309699292*sv,G=-1.2684380046*lv+2.6097574011*mv-0.3413193965*sv,B=-0.0041960863*lv-0.7034186147*mv+1.7076147010*sv;
    const gc=x=>x<=0.0031308?12.92*x:1.055*Math.pow(Math.max(0,x),1/2.4)-0.055;
    const hx=x=>Math.round(Math.max(0,Math.min(1,gc(x)))*255).toString(16).padStart(2,'0');
    return'#'+hx(R)+hx(G)+hx(B);
  }
  function hexToOklch(hex){
    const p=s=>parseInt(s,16)/255;
    let r=p(hex.slice(1,3)),g=p(hex.slice(3,5)),b=p(hex.slice(5,7));
    const gd=x=>x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);
    r=gd(r);g=gd(g);b=gd(b);
    const l=0.4122214708*r+0.5363325363*g+0.0514459929*b,m=0.2119034982*r+0.6806995451*g+0.1073969566*b,s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
    const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
    const a=1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,bv=0.0259040371*l_+0.7827717662*m_-0.8086757660*s_,Lo=0.2104542553*l_+0.7936177850*m_-0.0040720468*s_;
    return{L:Lo,C:Math.sqrt(a*a+bv*bv),H:((Math.atan2(bv,a)*180/Math.PI)+360)%360};
  }
  function randomHex(){return oklch(0.45+Math.random()*0.20,0.12+Math.random()*0.13,Math.random()*360);}
  function buildFamily(H,maxC,anchorL){
    const steps=[{L:0.965,cs:0.15},{L:0.890,cs:0.35},{L:0.790,cs:0.58},{L:0.690,cs:0.80},{L:0.590,cs:1.00},{L:0.480,cs:0.82},{L:0.370,cs:0.65},{L:0.255,cs:0.45},{L:0.145,cs:0.22}];
    const sh=anchorL-0.590;
    return steps.map(s=>oklch(Math.max(0.04,Math.min(0.97,s.L+sh)),maxC*s.cs,H));
  }

  /* ── Load palette from settings ─────────────────────────── */
  const saved=(()=>{try{const r=localStorage.getItem('gsp_settings');return r?JSON.parse(r):null;}catch(e){return null;}})();
  const baseHex   = saved?.baseHex    || randomHex();
  const schemeId  = saved?.schemeId   || 'comp';
  const analogStep= saved?.analogStep || 0;
  const{H:bH,C:bC,L:bL}=hexToOklch(baseHex);
  const iterH=(bH+analogStep*30)%360;
  const maxC=Math.min(0.24,Math.max(bC*1.1,0.13));
  const OFFSETS={mono:0,anal:30,comp:180,split:150,triad:120,tetrad:90,key:0};
  const famDom=buildFamily(iterH,maxC,bL);
  const famSec=buildFamily((iterH+(OFFSETS[schemeId]??180))%360,maxC,bL);
  const baseTrue=famDom[4];

  document.documentElement.style.setProperty('--ch-base', baseTrue);
  document.getElementById('ch-logo').style.color = baseTrue;

  /* ── φ bars ──────────────────────────────────────────────── */
  const BAR_COLORS=[famDom[4],famSec[4],famDom[6],famSec[2],famDom[7],famSec[5],famDom[3]];
  const STAGGER_MS=70, EASE_DUR=780;

  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function easeOutQuart(t){return 1-Math.pow(1-t,4);}

  function animBar(el,targetPx,delay,easeFn){
    let st=null,go=false;
    function step(now){
      if(!go){if(!st)st=now;if(now-st<delay){requestAnimationFrame(step);return;}st=now;go=true;}
      const t=Math.min((now-st)/EASE_DUR,1);
      el.style.width=(easeFn(t)*targetPx).toFixed(2)+'px';
      if(t<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  (function buildBars(){
    const container=document.getElementById('phi-bars');
    const vw=window.innerWidth;
    let w=vw*0.45,sum=0,ci=0;
    while(sum<vw+2&&w>=0.5){
      const cl=Math.min(w,vw-sum+2);
      const bar=document.createElement('div');
      bar.className='phi-bar';
      bar.style.background=BAR_COLORS[ci%BAR_COLORS.length];
      bar.style.width='0px';
      container.appendChild(bar);
      animBar(bar,cl,ci*STAGGER_MS,ci===0?easeOutCubic:easeOutQuart);
      sum+=cl;w=w/PHI;ci++;
      if(sum>=vw)break;
    }
    let resizeTimer=null;
    window.addEventListener('resize',()=>{
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(buildBars,150);
    });
  })();

})();
</script>
</body>
</html>
